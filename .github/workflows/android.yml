name: Android ARM64

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      xex_url:
        description: 'Optional direct URL to default.xex (F1 2012 Xbox 360, 434D0847)'
        required: false
        default: ''

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache ReXGlue SDK thirdparty dependencies
        id: cache-thirdparty
        uses: actions/cache@v4
        with:
          path: sdk/thirdparty
          key: thirdparty-v1-${{ hashFiles('tools/fetch_thirdparty.py') }}

      - name: Fetch ReXGlue SDK thirdparty dependencies
        if: steps.cache-thirdparty.outputs.cache-hit != 'true'
        run: python3 tools/fetch_thirdparty.py

      - name: Cache generated ReXGlue codegen output
        uses: actions/cache@v4
        with:
          path: |
            app/src/generated/default
            app/generated
          key: codegen-434D0847-v4-${{ hashFiles('app/f1_2012_manifest.toml', 'app/overrides.toml') }}

      - name: Fetch default.xex if xex_url provided
        if: ${{ github.event.inputs.xex_url != '' }}
        run: |
          mkdir -p assets/game_root
          curl -fSL "${{ github.event.inputs.xex_url }}" -o assets/game_root/default.xex
          ls -lh assets/game_root/default.xex

      - name: Run ReXGlue codegen (if default.xex present and sources.cmake missing)
        run: |
          if [ -f assets/game_root/default.xex ] && [ ! -f app/src/generated/default/sources.cmake ]; then
            sudo apt-get update && sudo apt-get install -y ninja-build clang lld pkg-config libx11-xcb-dev libx11-dev libxcb1-dev libwayland-dev
            cmake -S sdk -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_C_FLAGS="-march=x86-64-v3" -DCMAKE_CXX_FLAGS="-march=x86-64-v3" \
              -DREXGLUE_ENABLE_TRACY=OFF
            cmake --build build-host --target rexglue -j"$(nproc)"
            ./sdk/out/linux-amd64/rexglue codegen --force app/f1_2012_manifest.toml
            rm -rf build-host sdk/out
            test -f app/src/generated/default/sources.cmake
            ls -lh app/src/generated/default | head -n 20
          elif [ -f app/src/generated/default/sources.cmake ]; then
            echo "Using cached generated C++ sources from app/src/generated/default/."
          else
            echo "Fetching precompiled libmain.so from recomp-precompiled release for fast APK build..."
            mkdir -p android/app/src/main/jniLibs/arm64-v8a
            curl -fSL "https://github.com/${{ github.repository }}/releases/download/recomp-precompiled/libmain.so" \
              -o android/app/src/main/jniLibs/arm64-v8a/libmain.so
            ls -lh android/app/src/main/jniLibs/arm64-v8a/libmain.so
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-arm64-v1
          max-size: 2G

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.30.5'

      - name: Cache Gradle and NDK C++ build (.cxx)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/app/.cxx
            android/app/build/intermediates/cxx
          key: android-ndk-v1-${{ hashFiles('app/**', 'sdk/CMakeLists.txt', 'sdk/src/**', 'android/app/src/main/cpp/**', 'android/app/build.gradle') }}
          restore-keys: |
            android-ndk-v1-

      - name: Build ARM64 debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: f1-2012-android-arm64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
